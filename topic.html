<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>I have a topic — Wetalk</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="shell__bar">
      <div class="brand">
        <span class="brand__mark">W</span>
        <span class="brand__name">Wetalk</span>
      </div>
      <button class="btn btn--ghost" onclick="location.href='app.html'">← Home</button>
    </header>

    <main class="page">
      <div class="card entry-card">
        <h1 class="step-heading">I have a topic</h1>
        <p class="tagline" style="text-align:left;margin-top:2px">Enter your topic, then choose how your speech should be written.</p>

        <div class="field">
          <label for="topicInput">Your topic</label>
          <textarea class="input input--area" id="topicInput" placeholder="e.g. The importance of sleep for students"></textarea>
          <div class="hint" id="topicHint">Add any notes or key points you want included — the AI can use them.</div>
        </div>

        <span class="choice-label">How should your speech be written?</span>
        <div class="choice-group">
          <button type="button" class="choice-option is-active" id="opt-ai" onclick="selectMode('ai')">
            <span class="choice-option__title">Use AI to write my speech</span>
            <span class="choice-option__desc">The AI turns your topic into a complete speech.</span>
          </button>
          <button type="button" class="choice-option" id="opt-manual" onclick="selectMode('manual')">
            <span class="choice-option__title">I'll write it myself</span>
            <span class="choice-option__desc">You write the speech — the AI will still help you practice.</span>
          </button>
        </div>

        <button class="btn btn--primary" style="margin-top:24px" id="continueBtn" onclick="continueFlow()">Continue</button>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (!WetalkAuth.requireAuth()) { /* redirected */ }
    var mode = "ai";

    function selectMode(m) {
      mode = m;
      document.getElementById("opt-ai").classList.toggle("is-active", m === "ai");
      document.getElementById("opt-manual").classList.toggle("is-active", m === "manual");
    }

    function continueFlow() {
      var topic = document.getElementById("topicInput").value.trim();
      var hint = document.getElementById("topicHint");
      if (!topic) {
        hint.textContent = "Enter your topic to continue.";
        hint.className = "hint hint--error";
        document.getElementById("topicInput").focus();
        return;
      }
      hint.textContent = "";
      hint.className = "hint";
      try {
        localStorage.setItem("wetalk.topicDraft", JSON.stringify({ topic: topic, mode: mode }));
      } catch (e) { /* ignore */ }
      location.href = "script.html";
    }

    document.getElementById("topicInput").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); continueFlow(); }
    });
  </script>
</body>
</html>
