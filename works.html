<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#021024" />
  <title>Your works — Wetalk</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="shell__bar">
      <div class="brand">
        <span class="brand__mark">W</span>
        <span class="brand__name">Wetalk</span>
      </div>
      <div class="shell__user">
        <button class="btn btn--ghost" onclick="WetalkAuth.signOut()">Sign Out</button>
      </div>
    </header>

    <main class="page">
      <div class="card entry-card">
        <h1 class="step-heading">Welcome back!</h1>
        <p class="tagline" style="text-align:left;margin-top:2px">Continue a previous work, or start something new.</p>

        <div id="workList"></div>
        <p class="switch-line" id="emptyNote" style="display:none">No previous works yet.</p>
        <p class="hint" id="syncNote" style="display:none"></p>

        <button class="btn btn--primary" id="createBtn" style="margin-top:16px">Create new</button>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/store.js"></script>
  <script src="js/works.js"></script>
  <script>
    if (!WetalkAuth.requireAuth()) { /* redirected */ }
    var session = WetalkAuth.getSession();
    if (session) document.querySelector(".step-heading").textContent = "Welcome back, " + (session.username || "there") + "!";

    function render() {
      var works = WetalkWorks.getWorks();
      var list = document.getElementById("workList");
      list.innerHTML = "";
      document.getElementById("emptyNote").style.display = works.length ? "none" : "";

      works.forEach(function (w) {
        var card = document.createElement("div");
        card.className = "work-card";
        card.innerHTML =
          '<div class="work-card__info">' +
            '<div class="work-card__title">' + escapeHtml(w.title || "(untitled)") + '</div>' +
            '<div class="work-card__meta">' +
              (w.speech ? "Has speech · " : "") +
              (w.schedule && w.schedule.days ? w.schedule.days.length + " days planned · " : "") +
              new Date(w.updatedAt).toLocaleDateString() +
            '</div>' +
          '</div>' +
          '<button class="work-card__del" title="Delete">✕</button>';

        card.addEventListener("click", function () {
          WetalkWorks.resume(w);
          location.href = (w.speech || (w.schedule && w.schedule.days)) ? "schedule.html" : "script.html";
        });
        card.querySelector(".work-card__del").addEventListener("click", function (e) {
          e.stopPropagation();
          WetalkWorks.remove(w.id);
          render();
        });
        list.appendChild(card);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("createBtn").onclick = function () {
      // Clear current working state so a new project starts fresh.
      try { localStorage.removeItem("wetalk.topicDraft"); } catch (e) {}
      try { localStorage.removeItem("wetalk.speechDraft"); } catch (e) {}
      try { localStorage.removeItem("wetalk.schedule"); } catch (e) {}
      location.href = "app.html";
    };

    // ---- cloud sync ----
    // Re-render whenever the cached list changes (local save/delete or a pull).
    window.addEventListener("wetalk:works", function () { render(); });

    function syncNote() {
      var note = document.getElementById("syncNote");
      if (!note) return;
      if (WetalkStore && WetalkStore.enabled) {
        note.textContent = "Synced with your account.";
        note.style.display = "";
      } else if (WetalkAuth.isPreviewMode && WetalkAuth.isPreviewMode()) {
        note.textContent = "Saved in this browser only (Preview mode).";
        note.style.display = "";
      } else {
        note.style.display = "none";
      }
    }

    render();
    syncNote();
    // Pull the account's works, then render again once the merge is done.
    if (WetalkWorks.refresh) {
      WetalkWorks.refresh().then(function () { render(); syncNote(); }).catch(function () {});
    }
    if (WetalkAuth.onChange) {
      try { WetalkAuth.onChange(function () { syncNote(); WetalkWorks.refresh(); }); } catch (e) {}
    }
  </script>
</body>
</html>
