<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="theme-color" content="#021024" />
  <title>Sign In - Wetalk</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="page">
    <div class="card card--wide">
      <div class="wordmark">
        <div class="brand">
          <span class="brand__mark">W</span>
          <span class="brand__name">Wetalk</span>
        </div>
      </div>

      <h1 class="step-heading" style="text-align:center">Welcome back</h1>
      <p class="tagline">Jump back into your practice.</p>

      <button class="btn btn--oauth" id="googleBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
        </svg>
        Continue with Google
      </button>

      <button class="btn btn--oauth" id="githubBtn" type="button" style="margin-top:10px">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
        Continue with GitHub
      </button>

      <div class="divider">or sign in with email</div>

      <form id="signinForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false" autofocus />
          <div class="hint" id="emailHint" role="alert"></div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="password-row">
            <input class="input" id="password" type="password" placeholder="Your password" autocomplete="current-password" />
            <button type="button" class="password-toggle" id="pwToggle">Show</button>
          </div>
          <div class="hint" id="passwordHint" role="alert"></div>
        </div>

        <button class="btn btn--primary" id="signinBtn" type="submit">Sign In</button>
        <div class="hint" id="formHint" role="alert" style="margin-top:12px;text-align:center"></div>
      </form>

      <p class="switch-line"><a id="forgotLink" href="reset.html">Forgot password?</a></p>
      <p class="switch-line" style="margin-top:6px">New here? <a href="signup.html">Create an account</a></p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/vendor/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (function () {
      "use strict";

      var params = new URLSearchParams(window.location.search);
      var nextTarget = WetalkAuth.safeNext(params.get("next"), "works.html");
      var cameFromAuthLink = params.has("oauth") || params.get("confirmed") === "1";

      function goNext() {
        window.location.replace(nextTarget);
      }

      // OAuth callbacks and email-confirmation links land here with a session
      // (or tokens in the URL hash that auth.js exchanges in the background).
      if (cameFromAuthLink && WetalkAuth.getSession()) { goNext(); return; }
      if (params.get("confirmed") === "1") {
        setTimeout(function () { WetalkAuth.toast("Email confirmed. Welcome back."); }, 500);
      }
      WetalkAuth.onChange(function (session) {
        if (session) goNext();
      });

      var form = document.getElementById("signinForm");
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var signinBtn = document.getElementById("signinBtn");
      var forgotLink = document.getElementById("forgotLink");

      function setHint(id, message, isError) {
        var el = document.getElementById(id);
        if (!el) return;
        el.textContent = message || "";
        el.className = isError ? "hint hint--error" : "hint";
      }

      function updateForgotLink() {
        var email = emailInput.value.trim();
        forgotLink.href = "reset.html" + (email ? "?email=" + encodeURIComponent(email) : "");
      }
      emailInput.addEventListener("input", updateForgotLink);
      updateForgotLink();

      var pwToggle = document.getElementById("pwToggle");
      pwToggle.addEventListener("click", function () {
        var show = passwordInput.type === "password";
        passwordInput.type = show ? "text" : "password";
        pwToggle.textContent = show ? "Hide" : "Show";
      });

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        setHint("emailHint", "");
        setHint("passwordHint", "");
        setHint("formHint", "");

        var email = emailInput.value.trim();
        var password = passwordInput.value;
        var firstInvalid = null;

        var emailError = WetalkAuth.validateEmail(email);
        if (emailError) { setHint("emailHint", emailError, true); firstInvalid = emailInput; }
        if (!password) { setHint("passwordHint", "Enter your password.", true); firstInvalid = firstInvalid || passwordInput; }
        if (firstInvalid) { firstInvalid.focus(); return; }

        signinBtn.disabled = true;
        signinBtn.textContent = "Signing in...";
        WetalkAuth.authenticate(email, password)
          .then(function (result) {
            if (!result || !result.ok) {
              signinBtn.disabled = false;
              signinBtn.textContent = "Sign In";
              var error = (result && result.error) || "Could not sign in. Please try again.";
              if (/confirm/i.test(error)) setHint("formHint", error, true);
              else if (/no account found/i.test(error)) setHint("emailHint", error, true);
              else if (/password/i.test(error)) setHint("passwordHint", error, true);
              else setHint("formHint", error, true);
              return;
            }
            goNext();
          })
          .catch(function () {
            signinBtn.disabled = false;
            signinBtn.textContent = "Sign In";
            setHint("formHint", "Could not sign in. Please try again.", true);
          });
      });

      document.getElementById("googleBtn").addEventListener("click", function () {
        WetalkAuth.oauthSignIn("google", nextTarget);
      });
      document.getElementById("githubBtn").addEventListener("click", function () {
        WetalkAuth.oauthSignIn("github", nextTarget);
      });
    })();
  </script>
</body>
</html>
