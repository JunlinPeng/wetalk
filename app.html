<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home — Wetalk</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="shell__bar">
      <div class="brand">
        <span class="brand__mark">W</span>
        <span class="brand__name">Wetalk</span>
      </div>
      <div class="shell__user">
        <span class="avatar" id="avatar">?</span>
        <span id="username" style="color:var(--text-muted);font-weight:600"></span>
        <button class="btn btn--ghost" onclick="location.href='works.html'">Works</button>
        <button class="btn btn--ghost" onclick="WetalkAuth.signOut()">Sign Out</button>
      </div>
    </header>

    <main class="home">
      <div class="home__heading">
        <h1 id="greeting">Welcome!</h1>
        <p>What would you like to work on today?</p>
      </div>

      <div class="section-grid">
        <button class="section-card" onclick="location.href='topic.html'">
          <span class="section-card__tag">Option A</span>
          <h2 class="section-card__title">I have a topic</h2>
          <p class="section-card__desc">Type in your topic and Wetalk takes it from there — an AI-written speech, a personalized practice schedule, and daily check-ins guided by AI coaching.</p>
          <ul class="section-card__list">
            <li>Type in your topic</li>
            <li>AI-generated speech</li>
            <li>AI-generated practice schedule</li>
            <li>Daily practice check-in with AI guidance</li>
          </ul>
          <span class="section-card__go">Start →</span>
        </button>

        <button class="section-card" onclick="location.href='impromptu.html'">
          <span class="section-card__tag section-card__tag--alt">Option B</span>
          <h2 class="section-card__title">I don't have a topic</h2>
          <p class="section-card__desc">Draw a surprise impromptu prompt, prepare and speak under the 7-minute timer, then get AI scores on organization, analysis, delivery, and creativity — with adaptive coaching that targets your weak spots.</p>
          <ul class="section-card__list">
            <li>Random impromptu prompts (3, choose 1)</li>
            <li>7-minute prep + speech timer</li>
            <li>AI scoring on 4 criteria</li>
            <li>Adaptive coaching tips</li>
          </ul>
          <span class="section-card__go">Start →</span>
        </button>
      </div>
    </main>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (!WetalkAuth.requireAuth()) { /* redirected */ }
    var session = WetalkAuth.getSession();
    if (session) {
      var name = session.username || "there";
      document.getElementById("username").textContent = name;
      document.getElementById("greeting").textContent = "Welcome, " + name + "!";
      document.getElementById("avatar").textContent = name.charAt(0).toUpperCase();
    }
  </script>
</body>
</html>
